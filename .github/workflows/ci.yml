name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest flake8
      - run: python -m compileall -q .
      - run: flake8 tdata_extract.py test_tdata_extract.py
      - run: pytest -q
